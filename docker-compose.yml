services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comicvault-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: mongodb://vault_admin:secure_vault_pass@mongo:27017/comicvault?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY_AES256: ${ENCRYPTION_KEY_AES256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    volumes:
      - temp_cache:/temp
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - vault-net
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7.0-jammy
    container_name: comicvault-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: vault_admin
      MONGO_INITDB_ROOT_PASSWORD: secure_vault_pass
      MONGO_INITDB_DATABASE: comicvault
    volumes:
      - mongo_data:/data/db
    networks:
      - vault-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  temp_cache:
    name: comicvault_temp_cache
  mongo_data:
    name: comicvault_mongo_data

networks:
  vault-net:
    name: comicvault_network
    driver: bridge
